<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指令手冊 — PongPong Bot</title>
<meta name="description" content="PongPong Bot 完整指令手冊 — 所有斜線指令的語法與使用範例。">
<link rel="icon" type="image/jpeg" href="images/pongpongicon.jpg">
<meta name="theme-color" content="#0a0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
.page-hero { padding: 140px 0 40px; text-align: center; }
.page-hero h1 { font-size: clamp(2.2rem,5vw,3.5rem); font-weight: 800; margin-bottom: 16px; }
.page-hero h1 .gradient { background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.page-hero p { color: var(--text-secondary); font-size: 1.1rem; max-width: 560px; margin: 0 auto; }

/* Search */
.search-bar {
  max-width: 500px; margin: 30px auto 0; position: relative;
}
.search-input {
  width: 100%; padding: 14px 20px 14px 48px; border-radius: 12px;
  border: 1px solid var(--bg-glass-border); background: var(--bg-card);
  color: var(--text-primary); font-family: inherit; font-size: 1rem; outline: none;
  transition: border-color var(--transition);
}
.search-input:focus { border-color: var(--accent-1); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }

/* Category Tabs */
.cat-tabs {
  display: flex; justify-content: center; gap: 8px; padding: 40px 0 30px;
  flex-wrap: wrap;
}
.cat-tab {
  padding: 8px 18px; border-radius: 8px; border: 1px solid var(--bg-glass-border);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  font-family: inherit; font-size: 0.85rem; font-weight: 500;
  transition: all var(--transition);
}
.cat-tab:hover, .cat-tab.active {
  background: var(--accent-1); color: white; border-color: var(--accent-1);
}

/* Command Cards */
.cmd-grid { display: grid; gap: 16px; padding-bottom: 100px; }
.cmd-card {
  background: var(--bg-card); border: 1px solid var(--bg-glass-border);
  border-radius: var(--radius); padding: 24px; transition: all var(--transition);
}
.cmd-card:hover { border-color: rgba(108,92,231,0.3); box-shadow: var(--shadow-glow); }
.cmd-card.hidden { display: none; }
.cmd-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.cmd-name {
  font-family: var(--font-code); font-size: 1rem; font-weight: 600;
  color: var(--accent-2);
}
.cmd-badge {
  padding: 2px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 600;
  background: rgba(108,92,231,0.15); color: var(--accent-3);
}
.cmd-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px; line-height: 1.6; }
.cmd-syntax {
  background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px 16px;
  font-family: var(--font-code); font-size: 0.85rem; color: var(--accent-3);
  margin-bottom: 12px; overflow-x: auto;
}
.cmd-example { color: var(--text-muted); font-size: 0.8rem; }
.cmd-example b { color: var(--text-secondary); }
.no-results {
  text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 1.1rem;
  display: none;
}
</style>
</head>
<body>
<div class="ambient-bg"><div class="ambient-orb"></div><div class="ambient-orb"></div><div class="ambient-orb"></div></div>
<nav class="navbar" id="site-nav"></nav>

<section class="page-hero">
  <div class="container">
    <div class="section-badge">📖 <span data-i18n="page_badge">使用手冊</span></div>
    <h1><span class="gradient" data-i18n="page_title">指令手冊</span></h1>
    <p data-i18n="page_desc">所有 PongPong 斜線指令的完整參考，包含語法與使用範例。</p>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜尋指令..." data-i18n-placeholder="search_ph">
    </div>
  </div>
</section>

<div class="container">
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="all" data-i18n="cat_all">全部</button>
    <button class="cat-tab" data-cat="translate" data-i18n="cat_tr">🌐 翻譯</button>
    <button class="cat-tab" data-cat="currency" data-i18n="cat_cc">💱 匯率</button>
    <button class="cat-tab" data-cat="stock" data-i18n="cat_st">📈 股票</button>
    <button class="cat-tab" data-cat="weather" data-i18n="cat_we">🌤️ 天氣</button>
    <button class="cat-tab" data-cat="travel" data-i18n="cat_tv">✈️ 旅遊</button>
    <button class="cat-tab" data-cat="fun" data-i18n="cat_fn">🎮 趣味</button>
    <button class="cat-tab" data-cat="daily" data-i18n="cat_dy">📅 每日</button>
    <button class="cat-tab" data-cat="spotify" data-i18n="cat_sp">🎵 Spotify</button>
  </div>

  <div class="cmd-grid" id="cmdGrid"></div>
  <div class="no-results" id="noResults" data-i18n="no_results">找不到符合的指令 😕</div>
</div>

<footer class="site-footer" id="site-footer"></footer>
<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script src="js/shared.js"></script>
<script>
window.pageTitles = { zh:'指令手冊 — PongPong', en:'Commands — PongPong', ja:'コマンド — PongPong' };
window.pageI18n = {
  zh: { page_badge:'使用手冊', page_title:'指令手冊', page_desc:'所有 PongPong 斜線指令的完整參考，包含語法與使用範例。', cat_all:'全部', cat_tr:'🌐 翻譯', cat_cc:'💱 匯率', cat_st:'📈 股票', cat_we:'🌤️ 天氣', cat_tv:'✈️ 旅遊', cat_fn:'🎮 趣味', cat_dy:'📅 每日', cat_sp:'🎵 Spotify', no_results:'找不到符合的指令 😕' },
  en: { page_badge:'Reference', page_title:'Commands', page_desc:'Complete reference for all PongPong slash commands with syntax and examples.', cat_all:'All', cat_tr:'🌐 Translation', cat_cc:'💱 Currency', cat_st:'📈 Stocks', cat_we:'🌤️ Weather', cat_tv:'✈️ Travel', cat_fn:'🎮 Fun', cat_dy:'📅 Daily', cat_sp:'🎵 Spotify', no_results:'No matching commands found 😕' },
  ja: { page_badge:'リファレンス', page_title:'コマンド', page_desc:'PongPongのすべてのスラッシュコマンドの完全なリファレンス。', cat_all:'すべて', cat_tr:'🌐 翻訳', cat_cc:'💱 為替', cat_st:'📈 株式', cat_we:'🌤️ 天気', cat_tv:'✈️ 旅行', cat_fn:'🎮 楽しい', cat_dy:'📅 毎日', cat_sp:'🎵 Spotify', no_results:'該当するコマンドがありません 😕' }
};

const commands = [
  { name:'/tr', cat:'translate', desc_zh:'翻譯文字，自動偵測或指定語言', desc_en:'Translate text with auto-detection or specified languages', desc_ja:'テキストを翻訳。自動検出または言語指定', syntax:'/tr <text> [from] [to]', example:'/tr Hello → 你好' },
  { name:'/setlang', cat:'translate', desc_zh:'設定個人預設翻譯語言', desc_en:'Set your default translation language', desc_ja:'デフォルト翻訳言語を設定', syntax:'/setlang <language>', example:'/setlang ja' },
  { name:'/history', cat:'translate', desc_zh:'查看翻譯歷史紀錄', desc_en:'View your translation history', desc_ja:'翻訳履歴を表示', syntax:'/history', example:'/history' },
  { name:'/cc', cat:'currency', desc_zh:'匯率兌換查詢', desc_en:'Currency exchange conversion', desc_ja:'為替レート変換', syntax:'/cc <amount> <from> <to>', example:'/cc 100 USD TWD → 3,120 TWD' },
  { name:'/stock', cat:'stock', desc_zh:'查詢股票或加密貨幣報價', desc_en:'Check stock or crypto prices', desc_ja:'株式・暗号通貨の価格を確認', syntax:'/stock <symbol>', example:'/stock TSLA' },
  { name:'/chart', cat:'stock', desc_zh:'查看股票或加密貨幣 K 線圖', desc_en:'View stock or crypto charts', desc_ja:'株式・暗号通貨チャートを表示', syntax:'/chart <symbol>', example:'/chart BTC' },
  { name:'/weather', cat:'weather', desc_zh:'查詢全球天氣預報', desc_en:'Check weather forecast for any city', desc_ja:'天気予報を確認', syntax:'/weather <city>', example:'/weather Tokyo' },
  { name:'/travel', cat:'travel', desc_zh:'取得城市的完整旅遊資訊', desc_en:'Get complete travel info for a city', desc_ja:'都市の旅行情報を取得', syntax:'/travel <city>', example:'/travel Paris' },
  { name:'/flagquiz', cat:'fun', desc_zh:'開始國旗問答遊戲', desc_en:'Start a flag quiz game', desc_ja:'国旗クイズを開始', syntax:'/flagquiz', example:'/flagquiz' },
  { name:'/roll', cat:'fun', desc_zh:'擲骰子', desc_en:'Roll dice', desc_ja:'サイコロを振る', syntax:'/roll [sides]', example:'/roll → 🎲 4' },
  { name:'/pick', cat:'fun', desc_zh:'從選項中隨機抽選', desc_en:'Randomly pick from options', desc_ja:'選択肢からランダムに選ぶ', syntax:'/pick <option1> <option2> ...', example:'/pick Pizza Sushi Ramen' },
  { name:'/setdaily', cat:'daily', desc_zh:'設定每日單字推播頻道', desc_en:'Set daily vocabulary push channel', desc_ja:'毎日の単語プッシュチャンネルを設定', syntax:'/setdaily <channel> <language>', example:'/setdaily #study ja' },
  { name:'/stopdaily', cat:'daily', desc_zh:'停止每日單字推播', desc_en:'Stop daily vocabulary push', desc_ja:'毎日の単語プッシュを停止', syntax:'/stopdaily', example:'/stopdaily' },
  { name:'/spotify connect', cat:'spotify', desc_zh:'連接你的 Spotify 帳號到語音頻道', desc_en:'Connect your Spotify account to voice channel', desc_ja:'Spotifyアカウントをボイスチャンネルに接続', syntax:'/spotify connect', example:'/spotify connect', badge:'Premium' },
  { name:'/spotify disconnect', cat:'spotify', desc_zh:'斷開 Spotify Connect 連線', desc_en:'Disconnect Spotify Connect', desc_ja:'Spotify Connectを切断', syntax:'/spotify disconnect', example:'/spotify disconnect' },
];

const grid = document.getElementById('cmdGrid');
const noRes = document.getElementById('noResults');

function renderCmds(filter, search) {
  grid.innerHTML = '';
  let count = 0;
  commands.forEach(cmd => {
    if (filter !== 'all' && cmd.cat !== filter) return;
    const lang = currentLang;
    const desc = cmd['desc_' + lang] || cmd.desc_en;
    if (search && !cmd.name.toLowerCase().includes(search) && !desc.toLowerCase().includes(search)) return;
    count++;
    const card = document.createElement('div');
    card.className = 'cmd-card reveal visible';
    card.innerHTML = `
      <div class="cmd-header">
        <span class="cmd-name">${cmd.name}</span>
        ${cmd.badge ? `<span class="cmd-badge">${cmd.badge}</span>` : ''}
      </div>
      <div class="cmd-desc">${desc}</div>
      <div class="cmd-syntax">${cmd.syntax}</div>
      <div class="cmd-example"><b>Example:</b> <code>${cmd.example}</code></div>`;
    grid.appendChild(card);
  });
  noRes.style.display = count === 0 ? 'block' : 'none';
}

// Tab clicks
document.querySelectorAll('.cat-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderCmds(tab.dataset.cat, document.getElementById('searchInput').value.toLowerCase());
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  renderCmds(document.querySelector('.cat-tab.active').dataset.cat, e.target.value.toLowerCase());
});

window.onLangSwitch = () => {
  renderCmds(document.querySelector('.cat-tab.active').dataset.cat, document.getElementById('searchInput').value.toLowerCase());
};

initShared('commands');
renderCmds('all', '');
</script>
</body>
</html>
